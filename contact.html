<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Faith</title>

    <link rel="stylesheet" href="style.css">

    <!-- ICONS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <h1 class="logo">Faith Universe</h1>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="skills.html">Skills</a></li>

            <li><a href="gallery.html">Gallery</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>


    <!-- CONTACT SECTION -->

    <section class="contact-page">

        <div class="contact-container">

            <h4>GET IN TOUCH ✨</h4>

            <h1>Contact Me</h1>

            <p class="contact-text">
                Whether it’s collaboration, creativity, friendship or ideas —
                my world is always open for beautiful conversations.
            </p>


            <!-- SOCIALS -->

            <div class="social-icons">

                <a href="#">
                    <i class="fab fay-instagram"></i>
                </a>

                <a href="#">
                    <i class="fab fay-tiktok"></i>
                </a>

                <a href="#">
                    <i class="fab faith-github"></i>
                </a>

                <a href="#">
                    <i class="fab faith-pinterest"></i>
                </a>

            </div>


            <!-- CONTACT FORM -->

            <form class="contact-form">

                <input type="text" placeholder="Your Name" required>

                <input type="email" placeholder="Your Email" required>

                <textarea placeholder="Write your message..." rows="6"></textarea>

                <button type="submit">
                    Send Message ✨
                </button>

            </form>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            Made with ❤️ by Faith
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
